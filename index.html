<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CiberNiche Store - MVP Pro</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            background: #1e293b; 
            padding: 2.5rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            text-align: center; 
            max-width: 400px; 
            width: 100%;
            animation: fadeIn 1.2s ease-in-out;
        }
        h1 { color: #38bdf8; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
        input { 
            width: 100%; 
            padding: 0.75rem; 
            margin-bottom: 1rem; 
            border-radius: 0.5rem; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white;
            box-sizing: border-box;
        }
        button { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            border-radius: 0.5rem; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { background: #0369a1; }
        .badge { display: inline-block; background: #065f46; color: #34d399; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; margin-top: 1.2rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>CiberNiche Store</h1>
        <p>Plataforma corporativa impulsada por agentes autónomos locales.</p>
        <form onsubmit="event.preventDefault(); alert('¡Formulario conectado y operativo!');">
            <input type="email" placeholder="Ingresa tu correo profesional..." required>
            <button type="submit">Unirme al MVP</button>
        </form>
        <div class="badge">● Sistema Operativo y En Vivo</div>
    </div>
</body>
</html>
